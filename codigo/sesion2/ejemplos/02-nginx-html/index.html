<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>UNI | Nginx HTML Demo</title>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: sans-serif; text-align: center; padding: 4rem; }
        .badge { background: #990000; color: #fbbf24; padding: 0.4rem 1rem; border-radius: 9999px; font-weight: bold; }
        h1 { color: #fbbf24; margin-top: 1rem; }

</head>
<body>
    <div class="card">
        <span class="badge">UNIVERSIDAD NACIONAL DE INGENIERÍA</span>
        <h1>🌐 Página Web Estática servida por Nginx</h1>
        <p>Esta página corre dentro de un servidor Nginx en puerto 80 sin ningún backend de programación.</p>
    </div>
</body>
</html>
